<style>
  html{scroll-behavior:smooth}

    background:linear-gradient(180deg,#070d26 0%,#040614 40%,#010104 100%);
    color:#e5e9f2;font-family:'Inter',sans-serif;overflow-x:hidden;

  ::selection{background:rgba(34,211,238,.35)}
  .glass{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:1.25rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 40px rgba(0,0,0,.45);
    transition:border-color .4s,box-shadow .4s,transform .4s;

  .glass:hover{border-color:rgba(34,211,238,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 44px rgba(34,211,238,.14)}
  .glass-hot{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

    box-shadow:0 0 34px rgba(34,211,238,.22),inset 0 1px 0 rgba(255,255,255,.1);
  }
  .neon{color:#22d3ee;text-shadow:0 0 18px rgba(34,211,238,.55)}
  .grad-text{background:linear-gradient(95deg,#FF9933 0%,#f8fafc 38%,#22d3ee 72%,#4ade80 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tri-bar{background:linear-gradient(90deg,#FF9933 0 33.4%,#f4f4f4 33.4% 66.7%,#138808 66.7% 100%)}
  .rv{opacity:0;transform:translateY(42px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
  .rv-in{opacity:1;transform:none}
  /* ---- Rocket stages ---- */
  .stage{cursor:pointer;transition:transform 1.5s cubic-bezier(.22,1,.36,1),filter .45s,opacity .45s}
  .stage:hover{filter:drop-shadow(0 0 16px rgba(34,211,238,.85))}
  .stage.active{filter:drop-shadow(0 0 18px var(--c))}
  .stage.dim{opacity:.35}
  .sep-line{transition:opacity 1.2s ease .3s}
  /* ---- Carousel ---- */
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  .snap-card{scroll-snap-align:center}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  @keyframes scrollDot{0%{transform:translateY(0);opacity:1}80%{transform:translateY(16px);opacity:0}100%{opacity:0}}
  .scroll-dot{animation:scrollDot 1.8s ease-in-out infinite}
  .tick{font-variant-numeric:tabular-nums}
  /* ---- Feature imagery ---- */
  .img-frame{position:relative;overflow:hidden;border-radius:1.25rem;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 40px rgba(0,0,0,.45);
    transition:border-color .4s,box-shadow .4s}
  .img-frame:hover{border-color:rgba(34,211,238,.5);box-shadow:0 0 34px rgba(34,211,238,.2),0 8px 44px rgba(34,211,238,.14)}
  .img-frame img{width:100%;height:auto;display:block;
    transition:transform .9s cubic-bezier(.22,1,.36,1),filter .6s;
    filter:saturate(.92)}
  .img-frame:hover img{transform:scale(1.07);filter:saturate(1.1)}
  .img-frame::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 52%,rgba(1,2,8,.82));
    opacity:.9;transition:opacity .5s}
  .img-frame:hover::after{opacity:.5}
  .img-caption{position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:1.1rem 1.4rem;transform:translateY(110%);opacity:0;
    transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .65s}
  .img-frame:hover .img-caption{transform:translateY(0);opacity:1}
  /* ---- Slide-in reveals ---- */
  .rv-slide-l{opacity:0;transform:translateX(-64px);
    transition:opacity 1.05s cubic-bezier(.22,1,.36,1),transform 1.05s cubic-bezier(.22,1,.36,1)}
  .rv-slide-r{opacity:0;transform:translateX(64px);
    transition:opacity 1.05s cubic-bezier(.22,1,.36,1),transform 1.05s cubic-bezier(.22,1,.36,1)}
  .rv-slide-l.rv-in,.rv-slide-r.rv-in{opacity:1;transform:none}
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ================= STARFIELD (parallax + twinkle) ================= */
function Starfield(){
  const ref = useRef(null);
  useEffect(()=>{
    const canvas = ref.current, ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let w, h, stars = [], raf, scrollY = 0;
    function init(){
      stars = [];
      const n = Math.floor(window.innerWidth * window.innerHeight / 2200);
      for(let i=0;i<n;i++){
        stars.push({
          x: Math.random()*w, y: Math.random()*h,
          r: (Math.random()*1.35 + .3) * DPR,
          d: Math.random()*0.6 + .2,
          tw: Math.random()*Math.PI*2,
          ts: Math.random()*0.025 + .006,
          hue: Math.random()<0.10 ? 190 : (Math.random()<0.05 ? 35 : 0)
        });
      }
    }
    function resize(){
      w = canvas.width = window.innerWidth * DPR;
      h = canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      init();
    }
    function draw(){
      ctx.clearRect(0,0,w,h);
      for(const s of stars){
        s.x -= s.d * 0.12 * DPR;
        if(s.x < -4) s.x = w + 4;
        s.tw += s.ts;
        const a = 0.3 + 0.7 * Math.abs(Math.sin(s.tw));
        let y = (s.y + scrollY * s.d * 0.32) % h; if(y < 0) y += h;
        ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.2832);
        ctx.fillStyle = s.hue ? `hsla(${s.hue},95%,72%,${a})` : `rgba(255,255,255,${a})`;
        ctx.fill();
      }
      raf = requestAnimationFrame(draw);
    }
    const onScroll = () => { scrollY = window.scrollY * DPR; };
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('scroll', onScroll, {passive:true});
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); window.removeEventListener('scroll', onScroll); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 z-0 pointer-events-none" aria-hidden="true"/>;
}

/* ================= REVEAL ON SCROLL ================= */
function useReveal(){
  useEffect(()=>{
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('rv-in'); io.unobserve(e.target); } });
    }, {threshold: 0.15});
    document.querySelectorAll('.rv, .rv-slide-l, .rv-slide-r').forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  }, []);
}

/* ================= NAV ================= */
function Nav(){
  const [scrolled, setScrolled] = useState(false);
  useEffect(()=>{
    const f = ()=>setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', f, {passive:true}); f();
    return ()=>window.removeEventListener('scroll', f);
  }, []);
  return (
    <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'py-2' : 'py-4'}`}>
      <div className="h-[3px] tri-bar opacity-90"></div>
      <nav className="glass mx-4 md:mx-10 mt-2 px-5 py-3 flex items-center justify-between rounded-2xl">
        <a href="#top" className="flex items-center gap-3">
          <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="#22d3ee" strokeWidth="1.6" opacity=".9"/>
            <path d="M20 6 L24 20 L20 34 L16 20 Z" fill="#FF9933" opacity=".95"/>
            <circle cx="20" cy="20" r="3.4" fill="#f8fafc"/>
          </svg>
          <span className="font-grotesk font-700 tracking-[.25em] text-sm md:text-base text-white">GAGANYAAN</span>
        </a>
        <div className="hidden md:flex items-center gap-8 font-grotesk text-sm tracking-widest text-slate-300">
          <a href="#mission" className="hover:text-cosmic-cyan transition-colors">MISSION</a>
          <a href="#crew" className="hover:text-cosmic-cyan transition-colors">CREW</a>
          <a href="#rocket" className="hover:text-cosmic-cyan transition-colors">HLVM3</a>
        </div>
        <a href="#rocket" className="hidden md:inline-block font-grotesk text-xs tracking-widest px-4 py-2 rounded-xl border border-cosmic-cyan/50 text-cosmic-cyan hover:bg-cosmic-cyan/10 transition-colors">EXPLORE VEHICLE</a>
      </nav>
    </header>
  );
}

/* ================= HERO ================= */
function Hero(){
  return (
    <section id="top" className="relative z-10 min-h-screen flex flex-col items-center justify-center text-center px-6 pt-28 pb-16">
      <p className="rv font-grotesk tracking-[.5em] text-xs md:text-sm text-cosmic-cyan mb-6">ISRO · HUMAN SPACEFLIGHT PROGRAMME</p>
      <h1 className="rv font-grotesk font-700 text-4xl md:text-6xl lg:text-7xl leading-tight max-w-5xl" style={{transitionDelay:'120ms'}}>
        Gaganyaan: <span className="grad-text">India's Leap</span><br/>into Human Spaceflight
      </h1>
      <p className="rv max-w-2xl mt-8 text-slate-300/90 text-base md:text-lg leading-relaxed" style={{transitionDelay:'240ms'}}>
        The Human Spaceflight Programme that will carry Indian astronauts to Low Earth Orbit —
        engineered, launched, and recovered on Indian soil and in Indian seas.
      </p>
      <div className="rv flex flex-wrap items-center justify-center gap-4 mt-10" style={{transitionDelay:'360ms'}}>
        <a href="#rocket" className="glass-hot font-grotesk tracking-widest text-sm px-7 py-3.5 text-white hover:scale-105 transition-transform">MEET THE HLVM3</a>
        <a href="#mission" className="glass font-grotesk tracking-widest text-sm px-7 py-3.5 text-slate-200">MISSION BRIEF</a>
      </div>
      <div className="rv flex flex-wrap justify-center gap-3 mt-12" style={{transitionDelay:'480ms'}}>
        {['3 ASTRONAUTS','400 KM LEO','3-DAY MISSION','SPLASHDOWN · INDIAN WATERS'].map(t=>(

const PARTS = [
  { id:'ces', name:'Crew Escape System', short:'CES', c:'#FF9933',
    desc:'Quick-acting solid motors designed to pull the Crew Module to a safe distance within seconds in the event of a launchpad or ascent emergency.',
    spec:['Solid rocket escape motors, activated in milliseconds','Covers low-altitude and high-altitude abort envelopes','Jettisoned via tower-separation once ascent is safe'] },
  { id:'cm', name:'Crew Module', short:'CM', c:'#22d3ee',
    desc:'The heart of Gaganyaan — a pressurized, double-walled cabin sustaining an earth-like environment for the three-member crew, wrapped in a Thermal Protection System for the fires of re-entry.',
    spec:['Pressurized, double-walled structure for crew survival','Earth-like environment: air, pressure & temperature control','Ablative Thermal Protection System for atmospheric re-entry','Parachute-assisted soft splashdown in Indian waters'] },
  { id:'sm', name:'Service Module', short:'SM', c:'#22d3ee',
    desc:'The unpressurized workhorse mated beneath the Crew Module — together they form the Orbital Module (OM), the spacecraft that lives in orbit.',

  { id:'c25', name:'C25 Cryogenic Stage', short:'C25', c:'#a78bfa',
    desc:'The cryogenic upper stage that delivers the Orbital Module to its precise 400 km parking orbit with graceful, high-efficiency thrust.',

  { id:'l110', name:'L110 Core Stage', short:'L110', c:'#4ade80',

        <path d="M210 22 L205 60 L215 60 Z" fill="#FF9933"/>
        <line x1="210" y1="58" x2="178" y2="118" stroke="#94a3b8" strokeWidth="2.5"/>
        <line x1="210" y1="58" x2="242" y2="118" stroke="#94a3b8" strokeWidth="2.5"/>
        <line x1="210" y1="58" x2="210" y2="118" stroke="#94a3b8" strokeWidth="2.5"/>

        <path d="M192 110 L188 126 L200 112 Z" fill="#c2410c"/>
        <path d="M228 110 L232 126 L220 112 Z" fill="#c2410c"/>
        <circle cx="210" cy="70" r="3.4" fill="#fde68a"/>
      </g>

      {/* Crew Module */}
      <g {...st('cm')}>
        <path d="M172 214 L184 158 L210 124 L236 158 L248 214 Z" fill="#e2e8f0" opacity=".95"/>
        <path d="M196 152 L210 132 L224 152 L210 164 Z" fill="#0ea5e9" opacity=".85"/>
        <path d="M172 214 L248 214 L244 224 L176 224 Z" fill="#94a3b8"/>
      </g>

      {/* Service Module */}

function PartCard({part, hot, onPick}){
  return (
    <div onClick={onPick} className={`${hot?'glass-hot':'glass'} p-6 md:p-8 cursor-pointer`}>
      <div className="flex items-center gap-3 mb-4">
        <span className="font-grotesk font-700 text-xs tracking-[.25em] px-3 py-1.5 rounded-lg"
              style={{background:`${part.c}1a`, border:`1px solid ${part.c}66`, color:part.c}}>{part.short}</span>
        <h3 className="font-grotesk font-600 text-xl text-white">{part.name}</h3>
      </div>
      <p className="text-slate-300/85 leading-relaxed">{part.desc}</p>
      <ul className="mt-5 space-y-2.5">
        {part.spec.map(s=>(
          <li key={s} className="flex gap-3 text-sm text-slate-400 leading-relaxed">
            <span className="mt-2 w-1.5 h-1.5 rounded-full shrink-0" style={{background:part.c, boxShadow:`0 0 8px ${part.c}`}}></span>{s}
          </li>
        ))}
      </ul>
    </div>
  );
}

function Rocket(){
  const [active, setActive] = useState('ces');
  const [exploded, setExploded] = useState(false);
  const secRef = useRef(null);
  useEffect(()=>{
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ setExploded(true); io.disconnect(); } }), {threshold:0.25});
    if(secRef.current) io.observe(secRef.current);
    return ()=>io.disconnect();
  }, []);
  const part = PARTS.find(p=>p.id===active);
  return (
    <section id="rocket" ref={secRef} className="relative z-10 px-6 md:px-16 lg:px-24 py-28">
      <p className="rv font-grotesk tracking-[.45em] text-xs text-cosmic-cyan mb-4">03 · THE LAUNCH VEHICLE</p>
      <h2 className="rv font-grotesk font-700 text-3xl md:text-5xl leading-tight" style={{transitionDelay:'120ms'}}>
        Human-Rated LVM3 — <span className="grad-text">HLVM3</span>
      </h2>
      <p className="rv max-w-2xl mt-6 text-slate-300/85 leading-relaxed" style={{transitionDelay:'200ms'}}>
        India's heaviest rocket, human-rated for the first time. Scroll here and the vehicle stages separate into
        an exploded view — <span className="text-white">hover or tap any stage</span> to read its ISRO engineering brief.
      </p>

      {/* Desktop layout */}
      <div className="hidden md:grid lg:grid-cols-2 gap-10 items-start mt-14">
        <div className="glass p-8">
          <RocketSVG active={active} setActive={setActive} exploded={exploded}/>
